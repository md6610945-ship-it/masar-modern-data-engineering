name: Repair learner notebooks

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/repair-day01.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Repair Day 1 JSON and Day 2 shell-magic cell
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          # Day 1: the exported evidence notebook contained doubled quote escapes
          # inside captured stdout. Reduce only doubled-backslash+quote to the
          # correct JSON string escape, then parse and re-serialize cleanly.
          p1 = Path('day01/STUDENT.ipynb')
          text = p1.read_text(encoding='utf-8')
          fixed = text.replace('\\\\"', '\\"')
          day1 = json.loads(fixed)
          p1.write_text(json.dumps(day1, ensure_ascii=False, indent=1) + '\n', encoding='utf-8')
          print('Day 1 notebook JSON repaired and validated.')

          # Day 2: replace one Colab/IPython shell escape with equivalent valid
          # Python so the repository's source checker can compile every code cell.
          p2 = Path('day02/STUDENT.ipynb')
          day2 = json.loads(p2.read_text(encoding='utf-8'))
          changed = False
          for cell in day2.get('cells', []):
              if cell.get('cell_type') != 'code':
                  continue
              source = cell.get('source', [])
              source_text = ''.join(source) if isinstance(source, list) else source
              if source_text.strip() == '!pip install -q dbt-core==1.9.8 dbt-spark==1.9.1':
                  cell['source'] = [
                      'import subprocess, sys\n',
                      "subprocess.run([sys.executable, '-m', 'pip', 'install', '-q', 'dbt-core==1.9.8', 'dbt-spark==1.9.1'], check=True)\n",
                  ]
                  changed = True
          if not changed:
              print('Day 2 shell-magic cell was already repaired or not present.')
          p2.write_text(json.dumps(day2, ensure_ascii=False, indent=1) + '\n', encoding='utf-8')
          print('Day 2 notebook normalized.')
          PY
      - name: Commit repaired notebooks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add day01/STUDENT.ipynb day02/STUDENT.ipynb
          if git diff --cached --quiet; then
            echo 'No repair needed.'
          else
            git commit -m 'fix: normalize executed learner notebooks'
            git push origin HEAD:develop
          fi

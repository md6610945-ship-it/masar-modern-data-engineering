name: Final evidence refresh

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/final-evidence-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: masar-final-evidence-refresh
  cancel-in-progress: false

jobs:
  clean-full-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out submitted branch
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'requirements*.txt'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install course environment
        run: |
          python -m pip install -r requirements-course.txt -r requirements-day01.txt
          python -m pip check

      - name: Start local Kafka broker
        run: |
          docker compose -f infrastructure/kafka/compose.yaml up -d --wait --wait-timeout 120
          docker compose -f infrastructure/kafka/compose.yaml ps

      - name: Make extracted Day 1 notebook self-contained
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('day01/STUDENT.ipynb')
          nb = json.loads(path.read_text(encoding='utf-8'))
          first_code = next(cell for cell in nb['cells'] if cell.get('cell_type') == 'code')
          source = first_code.get('source', [])
          text = ''.join(source) if isinstance(source, list) else source
          if 'import json' not in text:
              if isinstance(source, list):
                  first_code['source'] = ['import json\n', *source]
              else:
                  first_code['source'] = 'import json\n' + source
              path.write_text(json.dumps(nb, ensure_ascii=False, indent=1) + '\n', encoding='utf-8')
          PY
          if ! git diff --quiet -- day01/STUDENT.ipynb; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add day01/STUDENT.ipynb
            git commit -m 'fix: make Day 1 executed notebook self-contained'
            git push origin HEAD:develop
          fi

      - name: Execute the complete five-day course twice
        id: execute
        continue-on-error: true
        env:
          SPARK_LOCAL_IP: 127.0.0.1
          PYSPARK_PYTHON: python
        run: |
          python -u scripts/execute_student_course.py

      - name: Persist clean-run diagnostic on failure
        if: steps.execute.outcome == 'failure'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os
          src = Path('evidence/student-course/notebooks/run_1/summary.json')
          if src.exists():
              data = json.loads(src.read_text(encoding='utf-8'))
          else:
              data = {'status':'FAILED', 'error':'No run_1 summary was produced'}
          data['github_actions_run_url'] = os.environ['RUN_URL']
          Path('/tmp/clean_run_failure.json').write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
          git reset --hard HEAD
          git clean -fd
          cp /tmp/clean_run_failure.json reports/clean_run_failure.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/clean_run_failure.json
          git commit -m 'evidence: retain clean-run failure diagnostic'
          git push origin HEAD:develop
          exit 1

      - name: Extract machine-generated stage reports
        if: steps.execute.outcome == 'success'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, shutil, subprocess

          root = Path.cwd()
          evidence = root / 'evidence/student-course/notebooks/run_1/outputs'
          out = Path('/tmp/final-reports')
          out.mkdir(parents=True, exist_ok=True)

          mapping = {
              'day02_staging_latest.json': 'day02_staging_latest.json',
              'day02_silver.json': 'day02_silver.json',
              'day03_transactions.json': 'day03_transactions.json',
              'day03_maintenance_latest.json': 'day03_maintenance_latest.json',
              'day04_stream_latest.json': 'quality/day04_stream_latest.json',
              'day04_quality_latest.json': 'quality/day04_quality_latest.json',
              'day05_recovery.json': 'serving/day05_recovery.json',
              'day05_serving_latest.json': 'serving/day05_serving_latest.json',
          }

          source_sha = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          manifest = {
              'scope': 'CLEAN_GITHUB_ACTIONS_FULL_PIPELINE_EVIDENCE',
              'source_branch': 'develop',
              'source_commit': source_sha,
              'workflow_run_url': os.environ['RUN_URL'],
              'independent_course_runs': 2,
              'machine_generated_reports': [],
          }

          for name, destination in mapping.items():
              matches = list(evidence.rglob(name))
              if len(matches) != 1:
                  raise RuntimeError(f'Expected exactly one {name}; found {len(matches)}')
              src = matches[0]
              dst = out / destination
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
              raw = dst.read_bytes()
              manifest['machine_generated_reports'].append({
                  'path': f'reports/{destination}',
                  'source_evidence_path': str(src.relative_to(root)),
                  'bytes': len(raw),
                  'sha256': hashlib.sha256(raw).hexdigest(),
              })

          (out / 'clean_run_manifest.json').write_text(
              json.dumps(manifest, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Restore clean checkout and retain only submission evidence
        if: steps.execute.outcome == 'success'
        run: |
          git reset --hard HEAD
          git clean -fd
          mkdir -p reports/quality reports/serving
          cp /tmp/final-reports/day02_staging_latest.json reports/day02_staging_latest.json
          cp /tmp/final-reports/day02_silver.json reports/day02_silver.json
          cp /tmp/final-reports/day03_transactions.json reports/day03_transactions.json
          cp /tmp/final-reports/day03_maintenance_latest.json reports/day03_maintenance_latest.json
          cp /tmp/final-reports/quality/day04_stream_latest.json reports/quality/day04_stream_latest.json
          cp /tmp/final-reports/quality/day04_quality_latest.json reports/quality/day04_quality_latest.json
          cp /tmp/final-reports/serving/day05_recovery.json reports/serving/day05_recovery.json
          cp /tmp/final-reports/serving/day05_serving_latest.json reports/serving/day05_serving_latest.json
          cp /tmp/final-reports/clean_run_manifest.json reports/clean_run_manifest.json
          rm -f reports/clean_run_failure.json

      - name: Commit clean-run evidence to develop
        if: steps.execute.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/day02_staging_latest.json \
                  reports/day02_silver.json \
                  reports/day03_transactions.json \
                  reports/day03_maintenance_latest.json \
                  reports/quality/day04_stream_latest.json \
                  reports/quality/day04_quality_latest.json \
                  reports/serving/day05_recovery.json \
                  reports/serving/day05_serving_latest.json \
                  reports/clean_run_manifest.json
          git add -u reports/clean_run_failure.json || true
          git commit -m 'evidence: retain clean full-pipeline machine reports'
          git push origin HEAD:develop

      - name: Add milestone tags to real learner commits
        if: steps.execute.outcome == 'success'
        run: |
          add_tag () {
            tag="$1"
            sha="$2"
            if git show-ref --tags --verify --quiet "refs/tags/$tag"; then
              echo "$tag already exists"
            else
              git tag "$tag" "$sha"
              git push origin "refs/tags/$tag"
            fi
          }
          add_tag day01 b227601da2650113bff595f90726334ce338cc77
          add_tag day02 0e46e5175d8bdd67da3fbfe7d01954df424f5928
          add_tag day03 ec28f5b560a3e7a55d315e452fb50ce130bd0bbc
          add_tag day04 b6d61107c1ac228de2eca799bba627b79861477b
          add_tag day05 616f6af281c2b210992cce5bae4c1d279448662b

      - name: Stop local Kafka broker
        if: always()
        run: docker compose -f infrastructure/kafka/compose.yaml down
